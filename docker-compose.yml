services:
  server:
    build:
      context: ./server
    environment:
      ADDR: ":8081"
      DESKS_FILE: /data/desks.json
    volumes:
      - office-data:/data
    restart: unless-stopped
    stop_grace_period: 10s
  client:
    build:
      context: ./client
    ports:
      - "${OFFICE_PORT:-8081}:80"
    depends_on:
      - server
    restart: unless-stopped
volumes:
  office-data:
